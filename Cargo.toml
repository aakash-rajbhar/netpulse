[package]
name = "netpulse"
version = "0.1.0"
edition = "2024"

[dependencies]
crossterm = "0.29.0"
dirs = "7.0.0"
ratatui = "0.30.2"
rusqlite = { version = "0.41.1", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
reqwest = { version = "0.13.5", default-features = false, features = [
    "blocking",
    "charset",
    "http2",
    "native-tls",
    "system-proxy",
] }

[target.'cfg(not(windows))'.dependencies]
reqwest = { version = "0.13.5", features = ["blocking", "rustls"] }
